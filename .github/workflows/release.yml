name: Release

on:
  workflow_dispatch:
    inputs:
      target_version:
        type: string
        required: false
        description: "mod version | empty = next option"
      update_type:
        type: choice
        required: false
        description: "update type"
        default: "minor"
        options:
          - "major"
          - "minor"
          - "patch"
          - "none"
      release_type:
        type: choice
        required: true
        description: "type of release"
        default: "release"
        options:
          - "alpha"
          - "beta"
          - "release"
      debug:
        type: boolean
        required: false
        default: false
        description: "enable debug mode (GitHub only)"

jobs:
  redirect:
    uses: AlmostReliable/.github/.github/workflows/release-nf.yml@main
    secrets:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    with:
      java-distribution: "microsoft"
      java-version: "21"
      mod_name: "GAG"
      curseforge_id: "694962"
      modrinth_id: "IeYLjzpn"
      dependencies: |
        placebo(optional){curseforge:283644}{modrinth:tCkE8p2N}
        jei(optional){curseforge:238222}{modrinth:u6dRKJwZ}
        emi(optional){curseforge:580555}{modrinth:fRiHVvU7}
      target_version: ${{ github.event.inputs.target_version }}
      update_type: ${{ github.event.inputs.update_type }}
      release_type: ${{ github.event.inputs.release_type }}
      loaders: "neoforge"
      debug: ${{ github.event.inputs.debug }}
